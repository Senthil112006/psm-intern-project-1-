<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f6f2">
  <title>Verified intern profile | PSM InternHub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { ink: '#17211d', moss: '#305b43', leaf: '#dbe8d8', paper: '#f4f6f2', line: '#e2e7df', muted: '#718078' },
          fontFamily: { sans: ['DM Sans', 'sans-serif'], mono: ['DM Mono', 'monospace'] }
        }
      }
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: light; }
    body { margin: 0; min-height: 100vh; background: #f4f6f2; color: #17211d; font-family: 'DM Sans', sans-serif; }
    .font-mono { font-family: 'DM Mono', monospace; }
  </style>
</head>
<body>
  <header class="border-b border-line bg-white">
    <div class="mx-auto flex h-[68px] max-w-[1000px] items-center gap-3 px-4 sm:px-7">
      <span class="grid h-10 w-10 place-items-center rounded-xl bg-moss text-[11px] font-extrabold tracking-wide text-white">PSM</span>
      <span class="leading-tight"><strong class="text-[15px] tracking-tight">Intern<span class="text-moss">Hub</span></strong><span class="block text-[9px] font-semibold uppercase tracking-[.15em] text-muted">Problem Solving Minds</span></span>
    </div>
  </header>
  <main class="mx-auto w-full max-w-[1000px] px-4 py-8 sm:px-7 sm:py-12">
    <p class="mb-2 text-[10px] font-bold uppercase tracking-[.18em] text-moss">Credential / Public profile</p>
    <h1 class="text-[27px] font-extrabold tracking-tight sm:text-[32px]">Verified portfolio</h1>
    <p id="profileError" class="mt-4 hidden rounded-lg border border-rose-200 bg-rose-50 p-4 text-[13px] text-rose-800" role="alert">This intern profile link is invalid or unavailable.</p>
    <article id="profileCard" class="mt-6 hidden overflow-hidden rounded-xl border border-line bg-white">
      <div class="grid gap-6 border-b border-line p-5 sm:grid-cols-[auto_1fr_auto] sm:items-center sm:p-7">
        <img id="profilePhoto" alt="" class="hidden h-24 w-24 rounded-xl object-cover ring-1 ring-line sm:h-28 sm:w-28">
        <div>
          <span class="inline-flex items-center gap-1.5 rounded-full bg-[#eaf2e8] px-2.5 py-1 text-[10px] font-bold text-moss"><i data-lucide="badge-check" class="h-3.5 w-3.5"></i> PSM verified credential</span>
          <h2 id="profileName" class="mt-2 text-[25px] font-extrabold tracking-tight"></h2>
          <p id="profileRole" class="mt-1 text-[13px] font-semibold text-moss"></p>
          <p id="profileCollege" class="mt-1 text-[12px] text-muted"></p>
        </div>
        <div class="border-t border-line pt-4 sm:border-l sm:border-t-0 sm:pl-7 sm:pt-0">
          <p class="text-[10px] font-bold uppercase tracking-wider text-muted">Composite score</p>
          <p id="profileScore" class="mt-1 text-[34px] font-extrabold leading-none"></p>
          <p id="profileGrade" class="mt-1 text-[11px] font-bold text-moss"></p>
        </div>
      </div>
      <div class="p-5 sm:p-7">
        <p class="text-[10px] font-bold uppercase tracking-wider text-muted">Capstone project</p>
        <h3 id="profileProject" class="mt-2 text-[19px] font-extrabold text-moss"></h3>
        <p id="profileDescription" class="mt-2 max-w-2xl text-[13px] leading-6 text-[#526159]"></p>
        <div id="profileSkills" class="mt-4 flex flex-wrap gap-2"></div>
      </div>
    </article>
  </main>
  <footer class="mt-8 border-t border-line px-4 py-5 text-center text-[10px] text-muted">© 2026 Problem Solving Minds · InternHub</footer>
  <script>
    const gradeDescriptions = { 'A+': 'Outstanding', A: 'Excellent', B: 'Very Good', C: 'Good', D: 'Satisfactory', E: 'Needs Improvement' };

    async function loadProfile() {
      const match = window.location.pathname.match(/^\/profile\/([^/]+)$/);
      if (!match) {
        document.getElementById('profileError').classList.remove('hidden');
        return;
      }
      try {
        const response = await fetch(`/api/public-profile/${encodeURIComponent(match[1])}`, { cache: 'no-store' });
        if (!response.ok) throw new Error(`Profile request failed with status ${response.status}.`);
        const profile = await response.json();
        document.title = `${profile.name} | Verified intern profile`;
        document.getElementById('profileName').textContent = profile.name;
        document.getElementById('profileRole').textContent = `${profile.role} · ${profile.id}`;
        document.getElementById('profileCollege').textContent = `${profile.college} · ${profile.domain}`;
        document.getElementById('profileScore').textContent = Number(profile.score).toFixed(1);
        document.getElementById('profileGrade').textContent = `Grade ${profile.grade} (${gradeDescriptions[profile.grade] || ''})`;
        document.getElementById('profileProject').textContent = profile.project;
        document.getElementById('profileDescription').textContent = profile.description;
        const skills = document.getElementById('profileSkills');
        profile.skills.forEach(skill => {
          const tag = document.createElement('span');
          tag.className = 'rounded-md bg-[#edf3eb] px-2.5 py-1.5 text-[10px] font-semibold text-moss';
          tag.textContent = skill;
          skills.append(tag);
        });
        const photo = document.getElementById('profilePhoto');
        if (profile.photo) {
          photo.src = profile.photo;
          photo.alt = `${profile.name} portrait`;
          photo.classList.remove('hidden');
        }
        document.getElementById('profileCard').classList.remove('hidden');
        if (window.lucide) lucide.createIcons();
      } catch (error) {
        console.error('The intern profile could not be loaded.', error);
        document.getElementById('profileError').classList.remove('hidden');
      }
    }

    loadProfile();
  </script>
</body>
</html>
